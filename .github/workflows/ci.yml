name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: pip install ruff==0.6.9
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install flask
      - name: unittest suite
        run: python -m unittest tests.test_gitmail_compose -v
      - name: sniffer self-test
        run: python tests/test_ai_tells.py
      - name: dashboard import smoke
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from dashboard.server import create_app; app = create_app(); print('dashboard imports OK')"
      - name: gitmail CLI smoke
        run: python scripts/gitmail.py --help
      - name: viralman CLI smoke
        run: python bin/viralman --help

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build tooling
        run: pip install build twine
      - name: build
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

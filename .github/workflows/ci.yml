name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install flask
      - name: unittest suite
        run: python -m unittest tests.test_gitmail_compose -v
      - name: sniffer self-test
        run: python tests/test_ai_tells.py
      - name: dashboard import smoke
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from dashboard.server import create_app; app = create_app(); print('dashboard imports OK')"
      - name: gitmail CLI smoke
        run: python scripts/gitmail.py --help
      - name: viralman CLI smoke
        run: python bin/viralman --help

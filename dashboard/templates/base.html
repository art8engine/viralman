<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>viralman — {{ active }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body data-page="{{ active }}">
  <header class="hd">
    <a class="hd-logo" href="/">viralman</a>
    <nav class="hd-tabs">
      <a class="hd-tab {{ 'active' if active == 'twitter' else '' }}" href="/twitter">
        <svg class="brand-icon brand-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <span>Twitter</span>
      </a>
      <a class="hd-tab {{ 'active' if active == 'reddit' else '' }}" href="/reddit">
        <svg class="brand-icon brand-r" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12c0 6.6 5.4 12 12 12s12-5.4 12-12c0-6.6-5.4-12-12-12zm5.9 13.7c0 3.2-3.6 5.7-7.9 5.7-4.4 0-7.9-2.6-7.9-5.7 0-1 .4-2 1-2.7-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6.4 0 .8.2 1.1.4 1.3-.9 3-1.4 5-1.5l1.1-3.6c.1-.2.3-.3.5-.3l3 .7c.3-.5.8-.8 1.4-.8.9 0 1.6.7 1.6 1.6 0 .9-.7 1.6-1.6 1.6-.9 0-1.6-.7-1.6-1.5l-2.7-.6-1 3.1c1.9.1 3.6.6 4.9 1.5.3-.2.7-.4 1.1-.4.9 0 1.6.7 1.6 1.6 0 .5-.2.9-.5 1.2.6.7 1 1.7 1 2.7zM8.4 11.5c-.7 0-1.4.7-1.4 1.4 0 .8.7 1.4 1.4 1.4.8 0 1.4-.6 1.4-1.4 0-.7-.7-1.4-1.4-1.4zm7.2 0c-.8 0-1.4.7-1.4 1.4 0 .8.6 1.4 1.4 1.4.7 0 1.4-.6 1.4-1.4 0-.7-.7-1.4-1.4-1.4zm-1.1 4c-.5.4-1.4.7-2.5.7s-2-.3-2.5-.7c-.2-.2-.5-.2-.7 0-.2.2-.2.5 0 .7.7.7 2 1.1 3.2 1.1 1.2 0 2.5-.4 3.2-1.1.2-.2.2-.5 0-.7-.2-.2-.5-.2-.7 0z"/></svg>
        <span>Reddit</span>
      </a>
      <a class="hd-tab {{ 'active' if active == 'gitmail' else '' }}" href="/gitmail">
        <svg class="brand-icon brand-mail" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.5 2L12 12.5 19.5 7zm-.5 1.4V17h16V8.4l-8 5.6z"/></svg>
        <span>Gitmail</span>
      </a>
      <a class="hd-tab {{ 'active' if active == 'twitter-reply' else '' }}" href="/twitter-reply">
        <svg class="brand-icon brand-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <span>Reply</span>
      </a>
    </nav>
    <div class="hd-spacer"></div>
    <a class="hd-setup {{ 'active' if active == 'setup' else '' }}" href="/setup" data-i18n="nav.setup">setup</a>
    <select class="hd-lang" id="lang-pick" aria-label="language">
      <option value="en">EN</option>
      <option value="ko">한</option>
      <option value="zh">中</option>
      <option value="ja">日</option>
    </select>
    <div class="hd-connect" id="connect">
      <button class="btn ghost" id="connect-btn">
        <span class="hd-dot" id="connect-dot"></span>
        <span data-i18n="connect">connect</span>
        <span id="connect-count">0/4</span>
        <span class="caret">▾</span>
      </button>
      <div class="hd-menu" id="connect-menu">
        <div class="hd-row" data-platform="twitter">
          <svg class="brand-icon brand-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span class="hd-pf">X</span>
          <span class="hd-st">—</span>
          <button class="btn small" data-act="oauth" data-platform="twitter" data-i18n="login">login</button>
          <button class="btn small ghost" data-act="manual" data-platform="twitter" data-i18n="tokens">tokens</button>
        </div>
        <div class="hd-row" data-platform="reddit">
          <svg class="brand-icon brand-r" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12c0 6.6 5.4 12 12 12s12-5.4 12-12c0-6.6-5.4-12-12-12zm5.9 13.7c0 3.2-3.6 5.7-7.9 5.7-4.4 0-7.9-2.6-7.9-5.7 0-1 .4-2 1-2.7-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6.4 0 .8.2 1.1.4 1.3-.9 3-1.4 5-1.5l1.1-3.6c.1-.2.3-.3.5-.3l3 .7c.3-.5.8-.8 1.4-.8.9 0 1.6.7 1.6 1.6 0 .9-.7 1.6-1.6 1.6-.9 0-1.6-.7-1.6-1.5l-2.7-.6-1 3.1c1.9.1 3.6.6 4.9 1.5.3-.2.7-.4 1.1-.4.9 0 1.6.7 1.6 1.6 0 .5-.2.9-.5 1.2.6.7 1 1.7 1 2.7zM8.4 11.5c-.7 0-1.4.7-1.4 1.4 0 .8.7 1.4 1.4 1.4.8 0 1.4-.6 1.4-1.4 0-.7-.7-1.4-1.4-1.4zm7.2 0c-.8 0-1.4.7-1.4 1.4 0 .8.6 1.4 1.4 1.4.7 0 1.4-.6 1.4-1.4 0-.7-.7-1.4-1.4-1.4zm-1.1 4c-.5.4-1.4.7-2.5.7s-2-.3-2.5-.7c-.2-.2-.5-.2-.7 0-.2.2-.2.5 0 .7.7.7 2 1.1 3.2 1.1 1.2 0 2.5-.4 3.2-1.1.2-.2.2-.5 0-.7-.2-.2-.5-.2-.7 0z"/></svg>
          <span class="hd-pf">Reddit</span>
          <span class="hd-st">—</span>
          <button class="btn small" data-act="oauth" data-platform="reddit" data-i18n="login">login</button>
          <button class="btn small ghost" data-act="manual" data-platform="reddit" data-i18n="tokens">tokens</button>
        </div>
        <div class="hd-row" data-platform="linkedin">
          <svg class="brand-icon brand-li" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          <span class="hd-pf">LinkedIn</span>
          <span class="hd-st">—</span>
          <button class="btn small" data-act="oauth" data-platform="linkedin" data-i18n="login">login</button>
          <button class="btn small ghost" data-act="manual" data-platform="linkedin" data-i18n="tokens">tokens</button>
        </div>
        <div class="hd-row" data-platform="gitmail">
          <svg class="brand-icon brand-mail" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.5 2L12 12.5 19.5 7zm-.5 1.4V17h16V8.4l-8 5.6z"/></svg>
          <span class="hd-pf">Gitmail</span>
          <span class="hd-st">—</span>
          <button class="btn small" data-act="manual" data-platform="gitmail" data-i18n="setup">setup</button>
        </div>
      </div>
    </div>
  </header>

  <div class="cta hidden" id="first-time-cta">
    <span class="cta-emoji">👋</span>
    <div class="cta-body">
      <strong data-i18n="cta.first.title">First time?</strong>
      <span data-i18n="cta.first.body">Register at least one platform in setup before posting.</span>
    </div>
    <a class="btn primary" href="/setup" data-i18n="cta.first.go">go to setup →</a>
  </div>

  <main class="main">{% block main %}{% endblock %}</main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <header class="modal-hd">
        <h3 id="modal-title">connect</h3>
        <button class="btn small ghost" id="modal-close" data-i18n="close">close</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

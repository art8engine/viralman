{% extends "base.html" %}
{% block main %}
<div class="wiz">

  <section class="step" data-step="1">
    <header><span class="num">1</span><h2 data-i18n="step.project">project</h2></header>
    <div class="grid two">
      <label><span data-i18n="project.name">name</span><input id="p-name" placeholder="viralman"></label>
      <label><span data-i18n="project.url">github URL</span><input id="p-url" data-i18n-placeholder="project.url.ph" placeholder="https://github.com/you/repo"></label>
    </div>
    <label><span data-i18n="project.pitch">one-line pitch</span><input id="p-pitch" data-i18n-placeholder="project.pitch.ph" placeholder="cuts cost by 47% in 3 weeks"></label>
    <label><span data-i18n="project.desc">description</span><textarea id="p-desc" rows="4" data-i18n-placeholder="project.desc.ph" placeholder="3–5 lines on what your project is and who it's for"></textarea></label>
    <div class="row right">
      <button class="btn primary" id="p-next" data-i18n="next">next →</button>
    </div>
  </section>

  <section class="step" data-step="2" data-locked>
    <header><span class="num">2</span><h2 data-i18n="step.generate">generate</h2></header>
    <div class="channels">
      <label class="ch"><input type="checkbox" id="ch-tw" checked><b>X</b><span data-i18n="ch.tw">tweet · thread</span></label>
      <label class="ch"><input type="checkbox" id="ch-rd" checked><b>Reddit</b><span data-i18n="ch.rd">post</span></label>
      <label class="ch"><input type="checkbox" id="ch-gm"><b>Gitmail</b><span data-i18n="ch.gm">email outreach</span></label>
    </div>
    <div class="grid two">
      <label><span data-i18n="provider">provider</span>
        <select id="g-provider">
          <option value="" data-i18n="auto">auto</option>
          <option value="claude">claude</option>
          <option value="openai">openai</option>
          <option value="gemini">gemini</option>
        </select>
      </label>
      <label><span data-i18n="mode">mode</span>
        <select id="g-mode">
          <option value="growth-story">growth-story</option>
          <option value="casual-hype">casual-hype</option>
          <option value="show-and-tell">show-and-tell</option>
          <option value="contrarian-take">contrarian-take</option>
        </select>
      </label>
    </div>
    <div class="row right">
      <button class="btn primary" id="g-run" data-i18n="generate">generate</button>
    </div>
    <div class="drafts" id="drafts"></div>
  </section>

  <section class="step" data-step="3" data-locked>
    <header><span class="num">3</span><h2 data-i18n="step.targets">targets</h2></header>

    <div class="tg" data-channel="twitter">
      <div class="tg-hd" data-i18n="tg.x_hashtags">X · hashtags</div>
      <div class="chips" id="tw-tags"></div>
      <div class="tg-add">
        <input id="tw-tag-input" data-i18n-placeholder="tg.add_hashtag" placeholder="add hashtag">
        <button class="btn small" id="tw-tag-add">+</button>
      </div>
    </div>

    <div class="tg" data-channel="reddit">
      <div class="tg-hd" data-i18n="tg.reddit_subs">Reddit · subreddits</div>
      <div class="chips" id="rd-subs"></div>
      <div class="tg-add">
        <input id="rd-sub-input" data-i18n-placeholder="tg.add_subreddit" placeholder="add subreddit (without r/)">
        <button class="btn small" id="rd-sub-add">+</button>
      </div>
      <div class="tg-hd" data-i18n="tg.reddit_threads">Reddit · threads to comment on</div>
      <ul class="threads" id="rd-threads"><li class="empty" data-i18n="tg.click_scan">click "scan" to fetch</li></ul>
      <div class="row">
        <button class="btn small" id="rd-scan" data-i18n="tg.scan">scan</button>
      </div>
    </div>

    <div class="tg" data-channel="gitmail">
      <div class="tg-hd" data-i18n="tg.gitmail_recipients">Gitmail · recipients</div>
      <div class="row gap">
        <label><span data-i18n="tg.max_users">max users</span><input type="number" id="gm-max" value="100" min="1" max="10000"></label>
        <label><span data-i18n="tg.min_stars">min stars</span><input type="number" id="gm-min-stars" value="200" min="1"></label>
        <label class="check"><input type="checkbox" id="gm-template"><span data-i18n="tg.template_only">template-only (cheaper)</span></label>
      </div>
    </div>

    <div class="row right">
      <button class="btn primary" id="t-next" data-i18n="next">next →</button>
    </div>
  </section>

  <section class="step" data-step="4" data-locked>
    <header><span class="num">4</span><h2 data-i18n="step.send">send</h2></header>
    <div class="row">
      <label class="check"><input type="checkbox" id="s-dryrun" checked><span data-i18n="send.dryrun">dry-run (don't actually send)</span></label>
      <label class="check"><input type="checkbox" id="s-confirm"><span data-i18n="send.confirm">I confirm I want to send under my accounts</span></label>
    </div>
    <div class="row right">
      <button class="btn big primary" id="s-go" disabled data-i18n="send.go">send</button>
      <button class="btn ghost" id="s-cancel" disabled data-i18n="cancel">cancel</button>
    </div>
    <div class="prog" id="prog">
      <div class="prog-step" data-key="twitter"><span class="dot"></span>X</div>
      <div class="prog-step" data-key="reddit"><span class="dot"></span>Reddit</div>
      <div class="prog-step" data-key="gitmail"><span class="dot"></span>Gitmail</div>
    </div>
    <pre class="log" id="log" data-i18n="send.no_run">no run yet</pre>
  </section>

</div>
{% endblock %}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viralman"
version = "0.4.0"
description = "Local dashboard + multi-platform poster + gitmail outreach for open-source maintainers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "viralman contributors" }]
keywords = ["viral", "marketing", "reddit", "twitter", "linkedin", "gitmail",
             "outreach", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
post = ["praw>=7.7", "tweepy>=4.14", "requests>=2.31"]
all  = ["praw>=7.7", "tweepy>=4.14", "requests>=2.31"]

[project.scripts]
viralman = "viralman_cli:main"

[project.urls]
Homepage = "https://github.com/art8engine/viralman"
Source   = "https://github.com/art8engine/viralman"
Issues   = "https://github.com/art8engine/viralman/issues"

[tool.setuptools]
packages = ["dashboard", "viralman_cli"]
include-package-data = true

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
